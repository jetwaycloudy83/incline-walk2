name: Build workout file

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Write generator
        run: |
          mkdir -p work out
          cat > work/main.swift <<'SWIFT'
          import Foundation
          import HealthKit
          import WorkoutKit

          // ---- Edit this table to change the workout ----
          struct Seg { let kind: String; let minutes: Double; let kmh: Double; let incline: Int }

          let workoutName = "50 Min Zone 2 Incline v7"
          let segs: [Seg] = [
              Seg(kind: "warmup",   minutes: 4, kmh: 4.3, incline: 5),
              Seg(kind: "work",     minutes: 5, kmh: 4.7, incline: 12),
              Seg(kind: "work",     minutes: 5, kmh: 4.6, incline: 13),
              Seg(kind: "work",     minutes: 5, kmh: 4.5, incline: 14),
              Seg(kind: "recovery", minutes: 2, kmh: 4.4, incline: 10),
              Seg(kind: "work",     minutes: 6, kmh: 4.5, incline: 13),
              Seg(kind: "work",     minutes: 6, kmh: 4.4, incline: 14),
              Seg(kind: "work",     minutes: 7, kmh: 4.3, incline: 15),
              Seg(kind: "work",     minutes: 5, kmh: 4.3, incline: 13),
              Seg(kind: "cooldown", minutes: 5, kmh: 3.6, incline: 2),
          ]
          let workZone = 2   // heart rate zone targeted during work intervals
          // ------------------------------------------------

          let activity: HKWorkoutActivityType = .walking
          let location: HKWorkoutSessionLocationType = .indoor

          func stepName(_ s: Seg) -> String {
              "\(String(format: "%.1f", s.kmh)) km/h @ \(s.incline)%"
          }

          func makeStep(_ s: Seg) -> WorkoutStep {
              var alert: (any WorkoutAlert)? = nil
              if s.kind == "work" {
                  let zone = HeartRateZoneAlert(zone: workZone)
                  if CustomWorkout.supportsAlert(zone, activity: activity, location: location) {
                      alert = zone
                  } else {
                      print("WARNING: heart rate zone alert not supported for indoor walk; omitted")
                  }
              }
              return WorkoutStep(goal: .time(s.minutes, .minutes), alert: alert, displayName: stepName(s))
          }

          guard CustomWorkout.supportsActivity(activity) else {
              print("ERROR: custom workouts are not supported for walking")
              exit(1)
          }

          let warmup = segs.first { $0.kind == "warmup" }.map(makeStep)
          let cooldown = segs.last { $0.kind == "cooldown" }.map(makeStep)
          let intervals: [IntervalStep] = segs.compactMap { s in
              switch s.kind {
              case "work": return IntervalStep(.work, step: makeStep(s))
              case "recovery": return IntervalStep(.recovery, step: makeStep(s))
              default: return nil
              }
          }

          let workout = CustomWorkout(
              activity: activity,
              location: location,
              displayName: workoutName,
              warmup: warmup,
              blocks: [IntervalBlock(steps: intervals, iterations: 1)],
              cooldown: cooldown
          )

          do {
              let plan = WorkoutPlan(.custom(workout))
              let data = try plan.dataRepresentation
              let url = URL(fileURLWithPath: CommandLine.arguments[1])
              try data.write(to: url)
              print("Wrote \(data.count) bytes to \(url.path)")
          } catch {
              print("ERROR: \(error)")
              exit(1)
          }
          SWIFT

      - name: Compile for iOS simulator
        run: |
          xcodebuild -version
          xcrun -sdk iphonesimulator swiftc \
            -target "$(uname -m)-apple-ios18.0-simulator" \
            work/main.swift -o work/gen

      - name: Run in simulator
        run: |
          UDID=$(xcrun simctl list devices available | grep -E 'iPhone' | head -n 1 | grep -oE '[0-9A-F]{8}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{12}')
          echo "Using simulator $UDID"
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl spawn "$UDID" "$PWD/work/gen" "$PWD/out/Zone2Incline-v7.workout"
          ls -l out
          test -s out/Zone2Incline-v7.workout

      - name: Keep a copy as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Zone2Incline-v7
          path: out/Zone2Incline-v7.workout

      - name: Publish as a release download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "workout-${{ github.run_number }}" out/Zone2Incline-v7.workout \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "50 Min Zone 2 Incline v7 (build ${{ github.run_number }})" \
            --notes "Open Zone2Incline-v7.workout on your iPhone and tap Add to Watch."
